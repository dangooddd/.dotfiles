# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json

disableStartupPopups: true
promptToReturnFromSubprocess: false
notARepository: skip

os:
  editPreset: nvim-remote

customCommands:
  - key: '<c-d>'
    context: files
    description: 'Diff in Neovim'
    output: terminal
    command: >-
      f={{.SelectedFile.Name | quote}};
      tmp=$(mktemp -d);
      old="$tmp/$(basename "$f")";
      git show ":$f" > "$old" || exit 1;
      if [ -n "$NVIM" ]; then
        nvim --server "$NVIM" --remote-tab "$PWD/$f";
        nvim --server "$NVIM" --remote-expr \
          "execute('leftabove vertical diffsplit ' . fnameescape('$old') . ' | wincmd l')";
      else
        nvim -d "$old" "$f";
      fi

gui:
  theme:
    activeBorderColor:
      - "#97BACC"
      - bold

    inactiveBorderColor:
      - "#556753"

    searchingActiveBorderColor:
      - "#DF867A"
      - bold

    optionsTextColor:
      - "#63AFA0"

    selectedLineBgColor:
      - "#2D382E"

    inactiveViewSelectedLineBgColor:
      - "#1D261F"
      - bold

    cherryPickedCommitFgColor:
      - "#131914"

    cherryPickedCommitBgColor:
      - "#DF867A"

    markedBaseCommitFgColor:
      - "#63AFA0"

    markedBaseCommitBgColor:
      - "#DAC05B"

    unstagedChangesColor:
      - "#DF867A"

    defaultFgColor:
      - "#D4DCC2"

  authorColors:
    "*": "#63AFA0"

  border: single
